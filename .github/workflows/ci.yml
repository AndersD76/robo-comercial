name: CI

on:
  push:
    branches: [master]
  pull_request:

# Token do CI só lê o repositório (Fase 4 do Prompt 3: permissões mínimas)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # PostgreSQL descartável para os testes de integração (testes_integracao/)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Mesma versão do container de produção (imagem Playwright jammy)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify syntax
        run: python -c "import py_compile; py_compile.compile('app.py', doraise=True)"

      - name: Run tests
        env:
          DATABASE_URL: ""
        run: pytest tests/ -v --tb=short

      - name: Guarda de SEO (título, descrição, canonical, JSON-LD, robots, sitemap)
        env:
          # Porta fechada de propósito: as páginas renderizam sem banco e as
          # programáticas usam a base sintética do cnpj_ingest --sample
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
        run: pytest tests/test_seo.py tests/test_seo_pseo.py tests/test_cota.py tests/test_indexnow.py tests/test_trafego.py tests/test_medicao.py tests/test_pagamento.py tests/test_eventos.py tests/test_seguranca_qa.py tests/test_contas.py -v --tb=short

      - name: Integração com PostgreSQL real (conta, isolamento, senha, pagamento, cota, e-mails, LGPD)
        env:
          PG_TESTE_URI: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest testes_integracao -v --tb=short

      - name: Validate templates
        run: |
          echo "Checking that all .html template files exist and are non-empty..."
          found=0
          for f in templates/*.html; do
            [ -e "$f" ] || continue
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "  OK: $f"
            found=$((found + 1))
          done
          echo "Validated $found template(s)."
