# Auditoria semanal (fora do caminho do deploy, para uma falha recém-publicada
# não travar uma correção urgente): dependências com CVE e segredos no histórico.
name: Segurança (semanal)
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      # Riscos aceitos (qa/RELATORIO-QUALIDADE-SEGURANCA.md, QA-SEC-012): soupsieve
      # 2.10, dependência do beautifulsoup4. As versões corrigidas (3.0.2 e 4.0)
      # exigem Python 3.11 e o container roda 3.10; nenhum código usa seletores
      # CSS (.select), onde o soupsieve atua. Tirar ao subir o container de Python.
      - name: Dependências com vulnerabilidade conhecida (pip-audit)
        run: >-
          pip install pip-audit && pip-audit -r requirements.txt
          --ignore-vuln CVE-2026-126190 --ignore-vuln CVE-2026-126191 --ignore-vuln CVE-2026-126193
      - name: Segredos em todo o histórico do git (sem imprimir valores)
        run: |
          python qa/ferramentas/segredos_historico.py | tee segredos.txt
          # o único achado conhecido é um token fixo de teste (falso positivo, ver qa/)
          test "$(grep -c '^- ' segredos.txt)" -le 1
