<!-- Cookie Consent Banner -->
<div id="cookie-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:10000;
    background:#0f172a;border-top:1px solid rgba(99,102,241,.3);padding:16px 24px;
    align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
  <p style="color:#e2e8f0;font-size:14px;margin:0;flex:1;min-width:240px;line-height:1.5">
    Usamos cookies para análise de tráfego (Google Analytics). Nenhum dado pessoal é vendido.
    <a href="/privacidade" style="color:#6366f1;text-decoration:underline">Política de Privacidade</a>
  </p>
  <div style="display:flex;gap:8px;flex-shrink:0">
    <button id="cookie-accept" style="background:#6366f1;color:#fff;border:none;padding:10px 20px;
        border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s">
      Aceitar cookies
    </button>
    <button id="cookie-reject" style="background:transparent;color:#94a3b8;border:1px solid rgba(255,255,255,.15);
        padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s">
      Recusar
    </button>
  </div>
</div>

<!-- Botao para reabrir configuracao de cookies -->
<button id="cookie-settings-btn" style="display:none;position:fixed;bottom:24px;left:24px;z-index:89;
    background:#0f172a;color:#94a3b8;border:1px solid rgba(255,255,255,.1);padding:6px 12px;
    border-radius:8px;font-size:11px;cursor:pointer;opacity:.7;transition:.2s"
    onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.7'">
  Cookies
</button>

<script>
(function(){
  var banner = document.getElementById('cookie-banner');
  var settingsBtn = document.getElementById('cookie-settings-btn');
  var consent = localStorage.getItem('cookie_consent');

  function showBanner() {
    banner.style.display = 'flex';
    settingsBtn.style.display = 'none';
  }
  function hideBanner() {
    banner.style.display = 'none';
    settingsBtn.style.display = 'block';
  }

  document.getElementById('cookie-accept').addEventListener('click', function() {
    localStorage.setItem('cookie_consent', 'accepted');
    hideBanner();
    if(typeof loadGA4==='function') loadGA4();
  });

  document.getElementById('cookie-reject').addEventListener('click', function() {
    localStorage.setItem('cookie_consent', 'rejected');
    hideBanner();
  });

  settingsBtn.addEventListener('click', function() {
    localStorage.removeItem('cookie_consent');
    showBanner();
  });

  // Ajustar posicao do botao Cookies no mobile (acima do sticky CTA)
  if (window.innerWidth < 769) settingsBtn.style.bottom = '80px';

  if (consent === 'accepted') {
    if(typeof loadGA4==='function') loadGA4();
    settingsBtn.style.display = 'block';
  } else if (consent === 'rejected') {
    settingsBtn.style.display = 'block';
  } else {
    showBanner();
  }
})();
</script>
